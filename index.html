<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>West Parker's Links</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <main class="main-container">

    <div class="image-row">
      <img src="/thumbnails/profile-pic.jpg" alt="West Parker headshot" class="avatar-image">
    </div>

    <h1 class="name-row">West Parker</h1>

    <p class="tagline">
      Former Green Beret. MBA candidate at Chicago Booth.
    </p>

    <div class="social-icons-row">
      <a href="https://github.com/westparker" target="_blank" aria-label="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
      <a href="https://www.linkedin.com/in/westleeparker/" target="_blank" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin-in"></i>
      </a>
      <a href="https://www.instagram.com/" target="_blank" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://www.INSERT-REAL-LINK" target="_blank" aria-label="Personal website">
        <i class="fa-solid fa-globe"></i>
      </a>
    </div> <!-- social-icons-row -->

    <div class="links-row">
      <a class="item" target="_blank" href="https://github.com/westparker/link-in-bio">
        <img class="thumbnail" src="/thumbnails/git.jpg" alt="">
        <span class="link-text">
          <span class="link-title">Latest GitHub project</span>
          <span class="link-subtitle">link-in-bio</span>
        </span>
        <i class="fa-solid fa-chevron-right chevron"></i>
      </a>

      <a class="item" target="_blank" href="https://www.substack.com">
        <img class="thumbnail" src="/thumbnails/substack.png" alt="">
        <span class="link-text">
          <span class="link-title">Latest blog post</span>
          <span class="link-subtitle">Coming soon</span>
        </span>
        <i class="fa-solid fa-chevron-right chevron"></i>
      </a>

      <a class="item" target="_blank" href="https://www.amazon.com">
        <img class="thumbnail" src="/thumbnails/amazon.jpg" alt="">
        <span class="link-text">
          <span class="link-title">Amazon shopping recs</span>
          <span class="link-subtitle">Coming soon</span>
        </span>
        <i class="fa-solid fa-chevron-right chevron"></i>
      </a>

      <a class="item" target="_blank" href="https://www.americanexpress.com/">
        <img class="thumbnail" src="/thumbnails/amex.jpg" alt="">
        <span class="link-text">
          <span class="link-title">Amex card referral</span>
          <span class="link-subtitle">Coming soon</span>
        </span>
        <i class="fa-solid fa-chevron-right chevron"></i>
      </a>
    </div> <!-- links-row -->

    <footer class="footer">
      West Parker, 2026
    </footer>

  </main> <!-- main-container -->
</body>

</html>
